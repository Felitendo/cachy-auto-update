# Type Path                                Mode UID                GID                Age Argument

# State the CLI reads unprivileged (`cachy-auto-update status`).
d /var/lib/cachy-auto-update               0755 root               root               -   -

# Home of the build account. Everything the AUR helper clones and compiles
# stays in here instead of in somebody's home directory.
d /var/lib/cachy-auto-update/builder       0700 cachy-auto-update  cachy-auto-update  -   -
d /var/cache/cachy-auto-update             0700 cachy-auto-update  cachy-auto-update  -   -

# Logs, matching pacman's own world-readable convention so `log` works without
# root.
d /var/log/cachy-auto-update               0755 root               root               -   -

d /run/cachy-auto-update                   0755 root               root               -   -
