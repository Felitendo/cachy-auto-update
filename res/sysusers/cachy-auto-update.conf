# The account that builds and installs AUR packages.
#
# makepkg, paru and yay all refuse to run as root, so the update service drops
# to this account for the AUR step. It has no password and no shell: nobody can
# log into it, and only root can become it.
u cachy-auto-update - "CachyOS Auto-Update builder" /var/lib/cachy-auto-update/builder /usr/bin/nologin
